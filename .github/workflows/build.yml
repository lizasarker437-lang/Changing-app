name: Build Battery Voice Alert APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Scaffold Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/batteryvoice
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BatteryVoiceAlert"
          include ':app'
          EOF

          # 2. build.gradle (Root)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.example.batteryvoice'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.batteryvoice"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="চার্জার বাংলা ভয়েস"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BatteryVoiceService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />

              </application>
          </manifest>
          EOF

          # 6. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/batteryvoice/MainActivity.kt
          package com.example.batteryvoice

          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val btnStart = findViewById<Button>(R.id.btnStart)
                  val btnStop = findViewById<Button>(R.id.btnStop)
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)

                  val serviceIntent = Intent(this, BatteryVoiceService::class.java)

                  btnStart.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      tvStatus.text = "স্ট্যাটাস: ভয়েস এলার্ট সক্রিয় আছে ✅"
                      Toast.makeText(this, "চার্জার ভয়েস সার্ভিস চালু হয়েছে", Toast.LENGTH_SHORT).show()
                  }

                  btnStop.setOnClickListener {
                      stopService(serviceIntent)
                      tvStatus.text = "স্ট্যাটাস: ভয়েস এলার্ট বন্ধ আছে ⏸️"
                      Toast.makeText(this, "সার্ভিস বন্ধ করা হয়েছে", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          # 7. BatteryVoiceService.kt
          cat << 'EOF' > app/src/main/java/com/example/batteryvoice/BatteryVoiceService.kt
          package com.example.batteryvoice

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Build
          import android.os.IBinder
          import android.speech.tts.TextToSpeech
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class BatteryVoiceService : Service(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private var isTtsReady = false

              private val powerReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_POWER_CONNECTED -> {
                              speakBengali("ফোন চার্জে লাগানো হয়েছে")
                          }
                          Intent.ACTION_POWER_DISCONNECTED -> {
                              speakBengali("ফোন চার্জ থেকে খোলা হয়েছে")
                          }
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()
                  tts = TextToSpeech(this, this)

                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_POWER_CONNECTED)
                      addAction(Intent.ACTION_POWER_DISCONNECTED)
                  }
                  registerReceiver(powerReceiver, filter)
              }

              private fun startForegroundNotification() {
                  val channelId = "battery_voice_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Battery Alert Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("চার্জার ভয়েস সার্ভিস")
                      .setContentText("চার্জার কানেক্ট ও ডিসকানেক্ট ট্র্যাক করা হচ্ছে...")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_charging)
                      .setOngoing(true)
                      .build()

                  startForeground(101, notification)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val result = tts?.setLanguage(Locale("bn", "BD"))
                      if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                          tts?.setLanguage(Locale("bn"))
                      }
                      isTtsReady = true
                  }
              }

              private fun speakBengali(text: String) {
                  if (isTtsReady) {
                      tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "BatteryVoiceId")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      unregisterReceiver(powerReceiver)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  tts?.stop()
                  tts?.shutdown()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 8. Layouts & Drawables
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#0F172A">

              <ImageView
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:src="@android:drawable/ic_lock_idle_charging"
                  android:tint="#10B981"
                  android:layout_marginBottom="20dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="চার্জার ভয়েস এলার্ট"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="12dp" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="স্ট্যাটাস: সেবা চালু করতে নিচের বাটনে চাপ দিন"
                  android:textColor="#94A3B8"
                  android:textSize="14sp"
                  android:layout_marginBottom="36dp" />

              <Button
                  android:id="@+id/btnStart"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:text="সার্ভিস চালু করুন"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#059669"
                  android:layout_marginBottom="16dp" />

              <Button
                  android:id="@+id/btnStop"
                  android:layout_width="match_parent"
                  android:layout_height="52dp"
                  android:text="সার্ভিস বন্ধ করুন"
                  android:textSize="16sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#EF4444" />

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">চার্জার বাংলা ভয়েস</string>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Voice-Alert-APK
          path: app/build/outputs/apk/debug/*.apk
